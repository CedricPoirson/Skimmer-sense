[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200

; Zigbee End Device requires the Zigbee partition table and mode define.
board_build.partitions = zigbee.csv

lib_ignore =
  OneWire

lib_deps =
  pstolarz/OneWireNg@^0.14.1
  milesburton/DallasTemperature@^4.0.6

build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D ZIGBEE_MODE_ED
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; v0.9-prep remains a USB/bench validation build for now.
  -D SKIMMERSENSE_DEBUG=1

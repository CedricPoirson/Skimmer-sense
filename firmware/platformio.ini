[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200

; Zigbee End Device requires the Zigbee partition table and mode define.
board_build.partitions = zigbee.csv

lib_ignore =
  OneWire

lib_deps =
  pstolarz/OneWireNg@^0.14.1
  milesburton/DallasTemperature@^4.0.6

build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D ZIGBEE_MODE_ED
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D SKIMMERSENSE_DEBUG=1

; Stable USB/bench firmware. Keeps the device continuously awake.
[env:seeed_xiao_esp32c6]
build_src_filter =
  +<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>

; Validated deep-sleep isolation test. Zigbee is intentionally not started.
; Keep this environment unchanged as the known-good timer/GPIO wake reference.
[env:seeed_xiao_esp32c6_sleep]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  +<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60

; Stage 0: keep the complete Zigbee endpoint descriptor but do nothing after
; reconnect. Validated on hardware: survives the post-connect idle and sleeps.
[env:seeed_xiao_esp32c6_sleep_zigbee_stage0]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  +<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_ZIGBEE_IDLE_MS=8000

; Stage 1 legacy experiment. Post-connect runtime updates from setup() caused a
; Load access fault before reportTemperature() was reached. Kept for diagnosis.
[env:seeed_xiao_esp32c6_sleep_zigbee_stage1]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  +<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_ZIGBEE_SETTLE_MS=2500
  -D SKIMMERSENSE_REPORT_SETTLE_MS=1200

; Stage 1 task experiment: follows Espressif's sleepy-sensor pattern more closely.
; After reconnect, a dedicated FreeRTOS task changes/reports ONLY endpoint 10
; temperature. Floats and battery are present in the descriptor but untouched.
[env:seeed_xiao_esp32c6_sleep_zigbee_stage1_task]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  +<sleep_zigbee_stage1_task.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_TASK_START_DELAY_MS=1000
  -D SKIMMERSENSE_REPORT_WAIT_MS=2000

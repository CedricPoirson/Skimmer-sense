[platformio]
default_envs =
  seeed_xiao_esp32c6
  seeed_xiao_esp32c6_sleep_zigbee_antiwave
  seeed_xiao_esp32c6_sleep_zigbee_production

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200

; SkimmerSense keeps the standard Arduino Zigbee persistent-storage addresses
; but enlarges both OTA application slots so the Zigbee + Wi-Fi SERVICE image
; fits while retaining two-slot OTA. The SPIFFS area is reduced; it is unused.
board_build.partitions = skimmersense_zigbee_ota.csv

lib_ignore =
  OneWire

lib_deps =
  pstolarz/OneWireNg@^0.14.1
  milesburton/DallasTemperature@^4.0.6

build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D ZIGBEE_MODE_ED
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D SKIMMERSENSE_DEBUG=1

; Stable USB/bench firmware. Keeps the device continuously awake.
[env:seeed_xiao_esp32c6]
build_src_filter =
  +<main.cpp>
  -<sleep_main.cpp>
  -<service_entry.cpp>
  -<service_mode.cpp>
  -<service_mode_sta.cpp>

; Hardware validation profile for the RTC-retained anti-wave state machine.
; Short timings make LOW_PENDING / WAIT_HIGH transitions practical to test.
; service_entry.cpp textually includes the validated sleep_main.cpp so SERVICE
; mode can wrap it without changing the production state-machine source.
; service_mode.cpp provides AP+STA directly: the private recovery AP remains
; available while the device optionally joins the configured home Wi-Fi.
[env:seeed_xiao_esp32c6_sleep_zigbee_antiwave]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  +<service_entry.cpp>
  +<service_mode.cpp>
  -<service_mode_sta.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_NORMAL_TIMER_SECONDS=60
  -D SKIMMERSENSE_LOW_CONFIRM_SECONDS=30
  -D SKIMMERSENSE_WAIT_HIGH_TIMER_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_BEGIN_TIMEOUT_MS=30000
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=30000
  -D SKIMMERSENSE_SERIAL_STARTUP_MS=1200
  -D SKIMMERSENSE_ZIGBEE_IDLE_MS=2000
  -D SKIMMERSENSE_BETWEEN_REPORTS_MS=100
  -D SKIMMERSENSE_POST_REPORT_WAIT_MS=750

; Production timing profile. Same validated anti-wave source, with realistic
; intervals for unattended operation: 30 min periodic refresh, 5 min LOW
; confirmation, and 30 min WAIT_HIGH fallback while awaiting high level.
[env:seeed_xiao_esp32c6_sleep_zigbee_production]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  +<service_entry.cpp>
  +<service_mode.cpp>
  -<service_mode_sta.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_PRODUCTION_BUILD=1
  -D SKIMMERSENSE_NORMAL_TIMER_SECONDS=1800
  -D SKIMMERSENSE_LOW_CONFIRM_SECONDS=300
  -D SKIMMERSENSE_WAIT_HIGH_TIMER_SECONDS=1800
  -D SKIMMERSENSE_ZIGBEE_BEGIN_TIMEOUT_MS=30000
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=30000
  -D SKIMMERSENSE_SERIAL_STARTUP_MS=50
  -D SKIMMERSENSE_ZIGBEE_IDLE_MS=2000
  -D SKIMMERSENSE_BETWEEN_REPORTS_MS=100
  -D SKIMMERSENSE_POST_REPORT_WAIT_MS=750

; Legacy isolation stages and one-off Zigbee experiments were moved out of
; firmware/src into firmware/tests. They are intentionally not active build
; environments anymore; keeping them in src made `pio run`/CI try to build
; source files that no longer existed there.

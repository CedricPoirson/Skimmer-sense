[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200

; Zigbee End Device requires the Zigbee partition table and mode define.
board_build.partitions = zigbee.csv

lib_ignore =
  OneWire

lib_deps =
  pstolarz/OneWireNg@^0.14.1
  milesburton/DallasTemperature@^4.0.6

build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D ZIGBEE_MODE_ED
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D SKIMMERSENSE_DEBUG=1

; Stable USB/bench firmware. Keeps the device continuously awake.
[env:seeed_xiao_esp32c6]
build_src_filter =
  +<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>

; Deep-sleep isolation test. Zigbee is intentionally not started here: this
; validates timer/GPIO wake behaviour independently from the explicit Zigbee
; report path which currently crashes in the sleepy build.
[env:seeed_xiao_esp32c6_sleep]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  +<sleep_gpio_test.cpp>

build_flags =
  ${env.build_flags}
  ; One-minute timer for bench validation. Production will use a much longer interval.
  -D SKIMMERSENSE_SLEEP_SECONDS=60

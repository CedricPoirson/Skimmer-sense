[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200

; Zigbee End Device requires the Zigbee partition table and mode define.
board_build.partitions = zigbee.csv

lib_ignore =
  OneWire

lib_deps =
  pstolarz/OneWireNg@^0.14.1
  milesburton/DallasTemperature@^4.0.6

build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D ZIGBEE_MODE_ED
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D SKIMMERSENSE_DEBUG=1

; Stable USB/bench firmware. Keeps the device continuously awake.
[env:seeed_xiao_esp32c6]
build_src_filter =
  +<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage1.cpp>

; Validated deep-sleep isolation test. Zigbee is intentionally not started.
; Keep this environment unchanged as the known-good timer/GPIO wake reference.
[env:seeed_xiao_esp32c6_sleep]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  +<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage1.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60

; Stage 1 of Zigbee + deep-sleep reintegration.
; Only temperature is explicitly reported after a post-connect settle delay.
; Binary Input and battery explicit reports stay disabled so the previous
; sleepy-build crash can be isolated before the anti-wave state machine lands.
[env:seeed_xiao_esp32c6_sleep_zigbee_stage1]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  +<sleep_zigbee_stage1.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_ZIGBEE_SETTLE_MS=2500
  -D SKIMMERSENSE_REPORT_SETTLE_MS=1200

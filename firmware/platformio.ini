[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200

; Zigbee End Device requires the Zigbee partition table and mode define.
board_build.partitions = zigbee.csv

lib_ignore =
  OneWire

lib_deps =
  pstolarz/OneWireNg@^0.14.1
  milesburton/DallasTemperature@^4.0.6

build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D ZIGBEE_MODE_ED
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D SKIMMERSENSE_DEBUG=1

; Stable USB/bench firmware. Keeps the device continuously awake.
[env:seeed_xiao_esp32c6]
build_src_filter =
  +<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>
  -<sleep_zigbee_preload_report.cpp>
  -<sleep_zigbee_snapshot_reports.cpp>
  -<sleep_zigbee_battery_direct.cpp>

; Validated deep-sleep isolation test. Zigbee is intentionally not started.
; Keep this environment unchanged as the known-good timer/GPIO wake reference.
[env:seeed_xiao_esp32c6_sleep]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  +<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>
  -<sleep_zigbee_preload_report.cpp>
  -<sleep_zigbee_snapshot_reports.cpp>
  -<sleep_zigbee_battery_direct.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60

; Stage 0: keep the complete Zigbee endpoint descriptor but do nothing after
; reconnect. Validated on hardware: survives the post-connect idle and sleeps.
[env:seeed_xiao_esp32c6_sleep_zigbee_stage0]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  +<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>
  -<sleep_zigbee_preload_report.cpp>
  -<sleep_zigbee_snapshot_reports.cpp>
  -<sleep_zigbee_battery_direct.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_ZIGBEE_IDLE_MS=8000

; Stage 1 legacy experiment. Post-connect runtime updates from setup() caused a
; Load access fault before reportTemperature() was reached. Kept for diagnosis.
[env:seeed_xiao_esp32c6_sleep_zigbee_stage1]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  +<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>
  -<sleep_zigbee_preload_report.cpp>
  -<sleep_zigbee_snapshot_reports.cpp>
  -<sleep_zigbee_battery_direct.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_ZIGBEE_SETTLE_MS=2500
  -D SKIMMERSENSE_REPORT_SETTLE_MS=1200

; Stage 1 task experiment: follows Espressif's sleepy-sensor pattern more closely.
; Hardware result with a 1 s pre-write delay: setTemperature() returned OK, then
; the Zigbee task crashed asynchronously before reportTemperature() was called.
[env:seeed_xiao_esp32c6_sleep_zigbee_stage1_task]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  +<sleep_zigbee_stage1_task.cpp>
  -<sleep_zigbee_preload_report.cpp>
  -<sleep_zigbee_snapshot_reports.cpp>
  -<sleep_zigbee_battery_direct.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_TASK_START_DELAY_MS=1000
  -D SKIMMERSENSE_REPORT_WAIT_MS=2000

; Stage 1B: same code, but wait 8 s after Zigbee.connected() before the first
; attribute write. Hardware result: still crashes in ZBOSS automatic reporting;
; addr2line points at zb_zcl_get_next_reporting_info / zb_zcl_report_attr.
[env:seeed_xiao_esp32c6_sleep_zigbee_stage1_wait8]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  +<sleep_zigbee_stage1_task.cpp>
  -<sleep_zigbee_preload_report.cpp>
  -<sleep_zigbee_snapshot_reports.cpp>
  -<sleep_zigbee_battery_direct.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_TASK_START_DELAY_MS=8000
  -D SKIMMERSENSE_REPORT_WAIT_MS=2000

; Stage 2: avoid runtime setTemperature() entirely. The temperature value is
; preloaded into the endpoint cluster before Zigbee.begin(), then one explicit
; report is built with a zero-initialized ZCL command structure. Validated on
; hardware across repeated deep-sleep cycles.
[env:seeed_xiao_esp32c6_sleep_zigbee_preload_report]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>
  +<sleep_zigbee_preload_report.cpp>
  -<sleep_zigbee_snapshot_reports.cpp>
  -<sleep_zigbee_battery_direct.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_PRELOAD_REPORT_DELAY_MS=8000
  -D SKIMMERSENSE_POST_REPORT_WAIT_MS=2000

; Stage 3: read the real DS18B20, both floats and MAX17048 first, preload ALL
; values into their endpoint cluster lists before Zigbee.begin(), then send
; zero-initialized explicit reports sequentially. Hardware result: temperature
; and both Binary Input reports queue successfully, but Power Configuration
; Battery Percentage Remaining asserts in esp_zigbee_zcl_command.c:263.
[env:seeed_xiao_esp32c6_sleep_zigbee_snapshot_reports]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>
  -<sleep_zigbee_preload_report.cpp>
  +<sleep_zigbee_snapshot_reports.cpp>
  -<sleep_zigbee_battery_direct.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_PRELOAD_REPORT_DELAY_MS=8000
  -D SKIMMERSENSE_BETWEEN_REPORTS_MS=400
  -D SKIMMERSENSE_POST_REPORT_WAIT_MS=2000

; Stage 3B: isolate only Battery Percentage Remaining. Keep the same endpoint
; descriptor, preload battery before Zigbee.begin(), wait 15 s after reconnect,
; then address the report directly to coordinator 0x0000 endpoint 1 instead of
; relying on a binding-table entry. This tests whether the old pairing has a
; stale/missing Power Configuration binding.
[env:seeed_xiao_esp32c6_sleep_zigbee_battery_direct]
build_src_filter =
  -<main.cpp>
  -<sleep_main.cpp>
  -<sleep_gpio_test.cpp>
  -<sleep_zigbee_stage0.cpp>
  -<sleep_zigbee_stage1.cpp>
  -<sleep_zigbee_stage1_task.cpp>
  -<sleep_zigbee_preload_report.cpp>
  -<sleep_zigbee_snapshot_reports.cpp>
  +<sleep_zigbee_battery_direct.cpp>

build_flags =
  ${env.build_flags}
  -D SKIMMERSENSE_SLEEP_SECONDS=60
  -D SKIMMERSENSE_ZIGBEE_WAIT_MS=10000
  -D SKIMMERSENSE_DIRECT_REPORT_DELAY_MS=15000
  -D SKIMMERSENSE_POST_REPORT_WAIT_MS=2000

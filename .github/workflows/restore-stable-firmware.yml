name: Restore stable firmware

on:
  push:
    branches:
      - feature/service-mode-ota
    paths:
      - ".github/workflows/restore-stable-firmware.yml"

permissions:
  contents: write

jobs:
  restore-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/service-mode-ota
          fetch-depth: 0

      - name: Restore validated sleep_main.cpp
        run: |
          git show 29d36343860e3960db088354468762790222bafa:firmware/src/sleep_main.cpp > firmware/src/sleep_main.cpp

      - name: Verify whitespace
        run: git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build anti-wave test profile
        run: pio run -d firmware -e seeed_xiao_esp32c6_sleep_zigbee_antiwave

      - name: Build production profile
        run: |
          cp firmware/include/wifi_secrets.example.h firmware/include/wifi_secrets.h
          pio run -d firmware -e seeed_xiao_esp32c6_sleep_zigbee_production

      - name: Commit stable restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/src/sleep_main.cpp
          git commit -m "Restore validated Zigbee reporting path"
          git push origin HEAD:feature/service-mode-ota

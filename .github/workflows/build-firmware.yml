name: Build firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"

jobs:
  platformio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build XIAO ESP32-C6 firmware
        run: pio run -d firmware

name: Build firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"

jobs:
  platformio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build all firmware profiles without home Wi-Fi
        run: pio run -d firmware

      - name: Build SERVICE mode with home Wi-Fi credentials
        run: |
          cp firmware/include/wifi_secrets.example.h firmware/include/wifi_secrets.h
          pio run -d firmware -e seeed_xiao_esp32c6_sleep_zigbee_production
